name: Update app release index
on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: app-release-index
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
      - name: Refresh current tags and version history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --no-tags origin "$BRANCH"
            git switch --detach FETCH_HEAD
            node .github/scripts/update-release-index.mjs
            git add -- releases.json RELEASES.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'docs(releases): refresh app release index'
            if git push origin "HEAD:refs/heads/$BRANCH"; then exit 0; fi
          done
          exit 1
